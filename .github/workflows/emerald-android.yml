name: Emerald RP APK Build

'on':
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-24.04
timeout-minutes: 30

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK tools
    uses: android-actions/setup-android@v4

  - name: Install Android SDK packages
    shell: bash
    run: |
      set -euo pipefail
      SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
      if [ ! -x "$SDKMANAGER" ]; then
        SDKMANAGER="$(command -v sdkmanager)"
      fi
      yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
      "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

  - name: Verify source ZIP
    shell: bash
    run: |
      set -euo pipefail
      test -f EmeraldRPLauncher_GitHub_Build.zip || {
        echo "Missing EmeraldRPLauncher_GitHub_Build.zip in the repository root."
        echo "Upload that ZIP to the top level of the repository, then rerun this workflow."
        exit 1
      }
      unzip -t EmeraldRPLauncher_GitHub_Build.zip

  - name: Extract Android project
    run: unzip -oq EmeraldRPLauncher_GitHub_Build.zip -d source

  - name: Verify Gradle project files
    shell: bash
    run: |
      set -euo pipefail
      test -f source/settings.gradle.kts
      test -f source/build.gradle.kts
      test -f source/app/build.gradle.kts
      test -f source/app/src/main/AndroidManifest.xml

  - name: Install Gradle 8.9
    shell: bash
    run: |
      set -euo pipefail
      curl --retry 3 --retry-delay 2 -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
      unzip -oq /tmp/gradle.zip -d /tmp
      echo /tmp/gradle-8.9/bin >> "$GITHUB_PATH"

  - name: Build debug APK
    working-directory: source
    run: gradle --no-daemon --stacktrace assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: EmeraldRP-Android-APK
      path: source/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14
