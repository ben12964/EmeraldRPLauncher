name: Emerald RP APK Builder

on:
  workflow_dispatch:
  push:
    paths:
      - "EmeraldRPLauncher_GitHub_Build.zip"
      - ".github/workflows/emerald-build.yml"
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract launcher project
        run: |
          unzip -o EmeraldRPLauncher_GitHub_Build.zip -d source

      - name: Install Gradle
        run: |
          curl -L --fail https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Compile Emerald RP APK
        working-directory: source
        run: gradle --no-daemon assembleDebug

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: EmeraldRP-Android-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
