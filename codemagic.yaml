
workflows:
  emerald-android:
    name: Emerald RP Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    scripts:
      - name: Extract nested ZIP packages
        script: |
          set -e
          mkdir -p extracted
          unzip -o EmeraldRPLauncher_GitHub_Build.zip -d extracted

          for depth in 1 2 3 4; do
            while IFS= read -r -d '' z; do
              dest="${z%.zip}_contents"
              mkdir -p "$dest"
              unzip -o "$z" -d "$dest"
              mv "$z" "$z.processed"
            done < <(find extracted -type f -name '*.zip' -print0)
          done

          echo "Located Gradle projects:"
          find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Align Java and Kotlin targets
        script: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re

          files = list(Path("extracted").rglob("app/build.gradle"))
          files += list(Path("extracted").rglob("app/build.gradle.kts"))

          if not files:
              raise SystemExit("ERROR: app/build.gradle was not found.")

          for p in files:
              s = p.read_text()
              print("Fixing Java target in", p)

              # Convert older Java targets to Java 17.
              s = re.sub(
                  r'JavaVersion\.VERSION_1_[6789]',
                  'JavaVersion.VERSION_17',
                  s
              )

              # Update string-based Kotlin JVM targets.
              s = re.sub(
                  r'(jvmTarget\s*=\s*)["\'](?:1\.[6789]|17)["\']',
                  r'\1"17"',
                  s
              )

              # Add Java 17 options if the Android block lacks them.
              if not re.search(r'\bcompileOptions\s*\{', s):
                  m = re.search(r'\bandroid\s*\{', s)
                  if not m:
                      raise SystemExit(f"ERROR: android block missing in {p}")

                  if p.name.endswith(".kts"):
                      block = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """
                  else:
                      block = """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          """
                  s = s[:m.end()] + block + s[m.end():]

              p.write_text(s)

          print("Java compatibility updates complete.")
          PY

      - name: Build debug APK
        script: |
          set -e

          PROJECT_FILE=$(find extracted -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            find extracted -maxdepth 6 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "Building project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            curl -fL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
            unzip -q gradle.zip -d .
            ./gradle-8.9/bin/gradle --no-daemon assembleDebug
          fi

    artifacts:
      - extracted/**/build/outputs/apk/**/*.apk
      
