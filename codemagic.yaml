
workflows:
  emerald-android:
    name: Emerald RP Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    scripts:
      - name: Inspect launcher ZIP
        script: |
          set -e
          echo "Repository files:"
          find . -maxdepth 3 -type f | head -100
          echo "ZIP files:"
          find . -type f -name '*.zip'
          echo "ZIP contents:"
          unzip -l EmeraldRPLauncher_GitHub_Build.zip | head -100

    artifacts:
      - EmeraldRPLauncher_GitHub_Build.zip
      
